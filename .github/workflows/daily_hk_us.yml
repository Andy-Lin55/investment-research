name: Daily Pipeline

on:
  schedule:
    # UTC 23:30 = 北京 07:30（次日），工作日运行
    - cron: '30 23 * * 0-4'
  workflow_dispatch:

# 公共环境变量，所有 job 共享
env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_UNIVERSE_DB_ID: ${{ secrets.NOTION_UNIVERSE_DB_ID }}
  NOTION_EVENTS_DB_ID: ${{ secrets.NOTION_EVENTS_DB_ID }}
  NOTION_RESEARCH_DB_ID: ${{ secrets.NOTION_RESEARCH_DB_ID }}
  NOTION_RESEARCH_HISTORY_DB_ID: ${{ secrets.NOTION_RESEARCH_HISTORY_DB_ID }}
  DMXAPI_KEY: ${{ secrets.DMXAPI_KEY }}
  DMXAPI_BASE_URL: ${{ vars.DMXAPI_BASE_URL || 'https://www.dmxapi.cn/v1' }}
  DMXAPI_MODEL: ${{ vars.DMXAPI_MODEL || 'gemini-3.8-flash' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1：A股公告（CNINFO + AI 解析）────────────────────────
  a_share_announcements:
    name: A-Share Announcements (CNINFO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run A-share announcements
        run: |
          python -c "
          from scheduler.jobs import _job_fetch_and_parse
          _job_fetch_and_parse()
          "

  # ── Job 2：A股新闻（AKShare 东方财富）────────────────────────
  a_share_news:
    name: A-Share News (AKShare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run A-share news
        run: |
          python -c "
          from scheduler.jobs import _job_daily_news_a_share
          _job_daily_news_a_share()
          "

  # ── Job 3：HK/US 文件（HKEX + SEC EDGAR）────────────────────
  hk_us_filings:
    name: HK/US Filings (HKEX + SEC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run HK/US filings
        run: |
          python -c "
          from scheduler.jobs import _job_fetch_filings
          _job_fetch_filings()
          "

  # ── Job 4：美股新闻（Finnhub）────────────────────────────────
  us_news:
    name: US News (Finnhub)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run US news
        run: |
          python -c "
          from scheduler.jobs import _job_daily_news_us
          _job_daily_news_us()
          "

  # ── Job 5：每日简报（等所有数据 job 完成后发送）──────────────
  briefing:
    name: Send Daily Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [a_share_announcements, a_share_news, hk_us_filings, us_news]
    # 即使某个数据 job 失败，仍发送简报（用已写入的数据）
    if: always()
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      BRIEFING_TO_EMAIL: ${{ secrets.BRIEFING_TO_EMAIL }}
      BRIEFING_FROM_EMAIL: ${{ secrets.BRIEFING_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Send daily briefing
        run: |
          python -c "
          from scheduler.jobs import _job_daily_briefing
          _job_daily_briefing()
          "
