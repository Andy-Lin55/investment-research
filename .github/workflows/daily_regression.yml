name: Daily pipeline offline regression

on:
  pull_request:
    paths:
      - 'config/**'
      - 'data_ingestion/**'
      - 'notion_sync/**'
      - 'scheduler/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/daily_regression.yml'

permissions:
  contents: read

jobs:
  offline:
    name: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      # These two baseline files still import the removed investment_research
      # package / SyncManager class. Keep the exclusions visible until migrated.
      - run: python -m pytest -q --ignore=tests/test_pdf_parser.py --ignore=tests/test_sync_manager.py
