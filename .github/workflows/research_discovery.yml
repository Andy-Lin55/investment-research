name: Holdings Research v17 (isolated)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [doctor, scan, worker, weekly]
        default: doctor
        description: v17 is independently disabled until acceptance
  schedule:
    - cron: '29 22 * * *'
    - cron: '49 2,8,14 * * *'
    - cron: '31 0 * * 6'

permissions:
  contents: read

# Serialize with the existing pilot as both rotate the dedicated Graph token.
concurrency:
  group: holdings-research-single-publisher
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && inputs.mode == 'doctor' || vars.RESEARCH_V17_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: research-pilot
    timeout-minutes: 90
    env:
      RESEARCH_V17_ENABLED: ${{ vars.RESEARCH_V17_ENABLED }}
      NOTION_TOKEN: ${{ secrets.RESEARCH_NOTION_TOKEN }}
      RESEARCH_UNIVERSE_SOURCE_ID: ${{ vars.RESEARCH_UNIVERSE_SOURCE_ID }}
      RESEARCH_NOTION_TASKS_SOURCE_ID: ${{ vars.RESEARCH_NOTION_TASKS_SOURCE_ID }}
      RESEARCH_NOTION_REPORTS_SOURCE_ID: ${{ vars.RESEARCH_NOTION_REPORTS_SOURCE_ID }}
      RESEARCH_EVENTS_SOURCE_ID: ${{ vars.RESEARCH_EVENTS_SOURCE_ID }}
      TUSHARE_TOKEN: ${{ secrets.RESEARCH_TUSHARE_TOKEN }}
      RESEARCH_ISSUERS_JSON: ${{ secrets.RESEARCH_ISSUERS_JSON }}
      RESEARCH_OFFICIAL_FEEDS_JSON: ${{ secrets.RESEARCH_OFFICIAL_FEEDS_JSON }}
      ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
      RESEARCH_GRAPH_SIMPLE_STAGING: ${{ vars.RESEARCH_GRAPH_SIMPLE_STAGING }}
      RESEARCH_GRAPH_CURL_DOWNLOADS: ${{ vars.RESEARCH_GRAPH_CURL_DOWNLOADS }}
      ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
      RESEARCH_GITHUB_TOKEN: ${{ secrets.RESEARCH_GITHUB_TOKEN }}
      DMXAPI_KEY: ${{ secrets.RESEARCH_DMXAPI_KEY }}
      GEMINI_API_KEY: ${{ secrets.RESEARCH_GEMINI_API_KEY }}
      FXBAOGAO_API_KEY: ${{ secrets.RESEARCH_FXBAOGAO_API_KEY }}
      RESEARCH_BROKER_SOURCES_ENABLED: ${{ vars.RESEARCH_BROKER_SOURCES_ENABLED }}
      RESEARCH_DMX_INPUT_CNY_PER_MILLION: ${{ vars.RESEARCH_DMX_INPUT_CNY_PER_MILLION }}
      RESEARCH_DMX_OUTPUT_CNY_PER_MILLION: ${{ vars.RESEARCH_DMX_OUTPUT_CNY_PER_MILLION }}
      RESEARCH_GEMINI_INPUT_CNY_PER_MILLION: ${{ vars.RESEARCH_GEMINI_INPUT_CNY_PER_MILLION }}
      RESEARCH_GEMINI_OUTPUT_CNY_PER_MILLION: ${{ vars.RESEARCH_GEMINI_OUTPUT_CNY_PER_MILLION }}
      SEC_USER_AGENT: ${{ secrets.RESEARCH_SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - name: Offline configuration status
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'doctor'
        run: python -m research.v17 doctor
      - name: Discover and queue independently of the daily briefing
        if: inputs.mode == 'scan' || github.event_name == 'schedule' && github.event.schedule != '31 0 * * 6'
        run: python -m research.v17 scan --write
      - name: All-Active weekly screen
        if: inputs.mode == 'weekly' || github.event.schedule == '31 0 * * 6'
        run: python -m research.v17 weekly --write
      - name: Resume staged research and verified delivery
        if: always() && (inputs.mode != 'doctor' || github.event_name == 'schedule')
        run: python -m research.v17 worker --write --limit 3
