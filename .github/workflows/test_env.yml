name: Test Environment Setup

on:
  workflow_dispatch:

env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_UNIVERSE_DB_ID: ${{ secrets.NOTION_UNIVERSE_DB_ID }}
  NOTION_EVENTS_DB_ID: ${{ secrets.NOTION_EVENTS_DB_ID }}
  NOTION_RESEARCH_DB_ID: ${{ secrets.NOTION_RESEARCH_DB_ID }}
  NOTION_RESEARCH_HISTORY_DB_ID: ${{ secrets.NOTION_RESEARCH_HISTORY_DB_ID }}
  TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
  DMXAPI_KEY: ${{ secrets.DMXAPI_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}

jobs:
  test_environment:
    name: Verify All APIs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Test Environment Variables
        run: |
          echo "🔍 Checking environment variables..."
          python << 'EOF'
          import os
          
          required_vars = [
              'NOTION_TOKEN',
              'NOTION_UNIVERSE_DB_ID',
              'NOTION_EVENTS_DB_ID',
              'NOTION_RESEARCH_DB_ID',
              'NOTION_RESEARCH_HISTORY_DB_ID',
              'TUSHARE_TOKEN',
              'DMXAPI_KEY',
              'GEMINI_API_KEY',
              'FINNHUB_KEY'
          ]
          
          missing = []
          for var in required_vars:
              value = os.getenv(var)
              if not value:
                  missing.append(var)
                  print(f"❌ {var} — NOT SET")
              else:
                  # 显示 masked 值（隐藏真实内容）
                  masked = value[:10] + '...' + value[-5:] if len(value) > 20 else value[:10] + '...'
                  print(f"✅ {var} — {masked}")
          
          if missing:
              print(f"\n⚠️  Missing variables: {', '.join(missing)}")
              exit(1)
          EOF
      
      - name: Test API Connectivity
        run: |
          echo "🌐 Testing API connections..."
          python << 'EOF'
          import os
          import requests
          
          token = os.getenv('NOTION_TOKEN')
          headers = {
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28'
          }
          
          # Test Notion API
          try:
              resp = requests.post(
                  'https://api.notion.com/v1/databases/0f3641457af782b6895b01874689e969/query',
                  headers=headers,
                  json={},
                  timeout=5
              )
              if resp.status_code == 200:
                  print("✅ Notion API — Connected")
              else:
                  print(f"❌ Notion API — Failed ({resp.status_code})")
                  exit(1)
          except Exception as e:
              print(f"❌ Notion API — Error: {e}")
              exit(1)
          
          # Test Tushare API
          try:
              tushare_token = os.getenv('TUSHARE_TOKEN')
              resp = requests.post(
                  'https://api.tushare.pro',
                  json={'api_name': 'trade_cal', 'token': tushare_token, 'params': {'exchange': 'SSE'}, 'fields': ''},
                  timeout=5
              )
              if resp.status_code == 200:
                  print("✅ Tushare API — Connected")
              else:
                  print(f"❌ Tushare API — Failed ({resp.status_code})")
          except Exception as e:
              print(f"❌ Tushare API — Error: {e}")
          
          # Test Gemini API
          try:
              import google.generativeai as genai
              genai.configure(api_key=os.getenv('GEMINI_API_KEY'))
              model = genai.GenerativeModel('gemini-2.0-flash')
              response = model.generate_content('test')
              print("✅ Gemini API — Connected")
          except Exception as e:
              print(f"⚠️  Gemini API — {type(e).__name__}: {str(e)[:60]}")
          
          print("\n✅ Environment setup test passed!")
          EOF
